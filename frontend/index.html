<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Money Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/styles.css">
</head>
<body>

  <!-- ===== SIDEBAR (fixed, never hides) ===== -->
  <aside class="sidebar">
    <div class="sidebar__logo">
      <!-- Logo: 40x40 -->
      <img src="img/logo.png" alt="">
    </div>

    <h2 class="sidebar__title">Navigation</h2>

    <nav class="sidebar__nav">
      <a href="#add" class="sidebar__link">
        <!-- Icon: 20x20 -->
        <img src="img/Plus.png" alt="">
        <span>Add a new one</span>
      </a>
      <a href="#history" class="sidebar__link">
        <!-- Icon: 20x20 -->
        <img src="img/Time Machine.png" alt="">
        <span>History</span>
      </a>
      <a href="#statistics" class="sidebar__link">
        <!-- Icon: 20x20 -->
        <img src="img/Analytics.png" alt="">
        <span>Statistics</span>
      </a>
    </nav>
  </aside>

  <!-- ===== MAIN CONTENT ===== -->
  <main class="main">

    <!-- Balance -->
    <section class="balance-section">
      <header class="page-header">
        <h1 class="page-title">My balance</h1>
        <span class="brand">FINO</span>
      </header>

      <div class="balance-card">
        <span class="balance-card__amount" id="balance">0,00</span>
        <span class="balance-card__currency">USD</span>
      </div>
    </section>

    <hr class="divider">

    <!-- Add -->
    <section class="section" id="add">
      <h2 class="section__title">Add</h2>

      <form class="add-form" id="add-form" action="#" novalidate>
        <div class="add-form__row">
          <input class="field" id="amount" type="text" inputmode="decimal" autocomplete="off" placeholder="Enter the amount">

          <div class="field field--select">
            <select id="type">
              <option value="income">Income</option>
              <option value="expense">Expense</option>
            </select>
          </div>

          <label class="field field--date" id="date-field">
            <input type="date" id="date">
            <!-- Calendar icon: 26x26 -->
            <img src="" alt="">
          </label>
        </div>

        <input class="field field--note" id="note" type="text" maxlength="100" autocomplete="off" placeholder="Add a note (optional)">

        <p class="add-form__label">Choose a category</p>

        <div class="categories">
          <label class="category category--food">
            <input type="radio" name="category" value="food">
            <span>Food</span>
          </label>
          <label class="category category--health">
            <input type="radio" name="category" value="health" checked>
            <span>Health</span>
          </label>
          <label class="category category--entertainment">
            <input type="radio" name="category" value="entertainment">
            <span>Entertainment</span>
          </label>
          <label class="category category--shopping">
            <input type="radio" name="category" value="shopping">
            <span>Shopping</span>
          </label>
          <label class="category category--other">
            <input type="radio" name="category" value="other">
            <span>Other</span>
          </label>
        </div>

        <button class="btn" id="add-button" type="submit">Add</button>
      </form>
    </section>

    <hr class="divider">

    <!-- History (rows are rendered by script.js from the database) -->
    <section class="section" id="history">
      <h2 class="section__title">History</h2>

      <div class="filters">
        <input class="field" id="history-search" type="text" autocomplete="off" placeholder="Search transaction">

        <div class="field field--select">
          <select id="history-type">
            <option value="all">All types</option>
            <option value="income">Income</option>
            <option value="expense">Expense</option>
          </select>
        </div>

        <div class="field field--select">
          <select id="history-category">
            <option value="all">All categories</option>
            <option value="food">Food</option>
            <option value="health">Health</option>
            <option value="entertainment">Entertainment</option>
            <option value="shopping">Shopping</option>
            <option value="other">Other</option>
          </select>
        </div>

        <div class="field field--select">
          <select id="history-period">
            <option value="month">This month</option>
            <option value="week">This week</option>
            <option value="year">This year</option>
          </select>
        </div>
      </div>

      <div class="history" id="history-list"></div>
    </section>

    <hr class="divider">

    <!-- Statistics (values are filled in by script.js) -->
    <section class="section section--last" id="statistics">
      <h2 class="section__title">Statistics</h2>

      <div class="filters filters--stats">
        <div class="field field--select">
          <select id="stats-period">
            <option value="month">This month</option>
            <option value="week">This week</option>
            <option value="year">This year</option>
          </select>
        </div>
        <div class="field field--select">
          <select id="stats-type">
            <option value="all">All types</option>
            <option value="income">Income</option>
            <option value="expense">Expense</option>
          </select>
        </div>
      </div>

      <div class="stats-cards">
        <div class="stat-card stat-card--dark">
          <span class="stat-card__label">Total balance</span>
          <span class="stat-card__value" id="stat-total">0 USD</span>
        </div>
        <div class="stat-card">
          <span class="stat-card__label">Income</span>
          <span class="stat-card__value stat-card__value--plus" id="stat-income">+0 USD</span>
        </div>
        <div class="stat-card">
          <span class="stat-card__label">Expenses</span>
          <span class="stat-card__value stat-card__value--minus" id="stat-expenses">-0 USD</span>
        </div>
      </div>

      <h3 class="stats__subtitle">By category</h3>

      <div class="stats-list">

        <div class="stat-row" data-category="food">
          <div class="transaction__icon transaction__icon--food">
            <!-- Icon: 32x32 -->
            <img src="" alt="">
          </div>
          <div class="stat-row__body">
            <div class="stat-row__top">
              <span class="transaction__name">Food</span>
              <span class="stat-row__value"><span data-amount>0</span> USD <small data-percent>0%</small></span>
            </div>
            <div class="bar"><div class="bar__fill bar__fill--food" data-bar style="width: 0%"></div></div>
          </div>
        </div>

        <div class="stat-row" data-category="health">
          <div class="transaction__icon transaction__icon--health">
            <!-- Icon: 32x32 -->
            <img src="" alt="">
          </div>
          <div class="stat-row__body">
            <div class="stat-row__top">
              <span class="transaction__name">Health</span>
              <span class="stat-row__value"><span data-amount>0</span> USD <small data-percent>0%</small></span>
            </div>
            <div class="bar"><div class="bar__fill bar__fill--health" data-bar style="width: 0%"></div></div>
          </div>
        </div>

        <div class="stat-row" data-category="entertainment">
          <div class="transaction__icon transaction__icon--entertainment">
            <!-- Icon: 32x32 -->
            <img src="" alt="">
          </div>
          <div class="stat-row__body">
            <div class="stat-row__top">
              <span class="transaction__name">Entertainment</span>
              <span class="stat-row__value"><span data-amount>0</span> USD <small data-percent>0%</small></span>
            </div>
            <div class="bar"><div class="bar__fill bar__fill--entertainment" data-bar style="width: 0%"></div></div>
          </div>
        </div>

        <div class="stat-row" data-category="shopping">
          <div class="transaction__icon transaction__icon--shopping">
            <!-- Icon: 32x32 -->
            <img src="" alt="">
          </div>
          <div class="stat-row__body">
            <div class="stat-row__top">
              <span class="transaction__name">Shopping</span>
              <span class="stat-row__value"><span data-amount>0</span> USD <small data-percent>0%</small></span>
            </div>
            <div class="bar"><div class="bar__fill bar__fill--shopping" data-bar style="width: 0%"></div></div>
          </div>
        </div>

        <div class="stat-row" data-category="other">
          <div class="transaction__icon transaction__icon--other">
            <!-- Icon: 32x32 -->
            <img src="" alt="">
          </div>
          <div class="stat-row__body">
            <div class="stat-row__top">
              <span class="transaction__name">Other</span>
              <span class="stat-row__value"><span data-amount>0</span> USD <small data-percent>0%</small></span>
            </div>
            <div class="bar"><div class="bar__fill bar__fill--other" data-bar style="width: 0%"></div></div>
          </div>
        </div>

      </div>

      <h3 class="stats__subtitle">Overview</h3>

      <!-- Chart is drawn by script.js (SVG) -->
      <div class="chart" id="chart"></div>
    </section>

  </main>

  <!-- Template for one history row. script.js clones it for every transaction. -->
  <template id="transaction-template">
    <div class="transaction">
      <div class="transaction__icon">
        <!-- Icon: 32x32 (path is set by script.js, see ICONS) -->
        <img src="" alt="">
      </div>
      <span class="transaction__name"></span>
      <div class="transaction__info">
        <span class="transaction__amount"></span>
        <span class="transaction__date"></span>
      </div>
      <button class="dots" type="button" aria-label="Delete transaction" data-action="delete"><span></span><span></span><span></span></button>
    </div>
  </template>

  <script src="scripts/script.js"></script>
</body>
</html>
